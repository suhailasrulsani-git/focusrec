<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self'">
  <title>FocusRec panel</title>
  <link rel="stylesheet" href="panel.css">
</head>
<body>
  <div id="toast" class="toast hidden"></div>
  <div id="box" class="box hidden">
    <div class="rows">
      <div class="row"><span id="rec" class="rec"><span class="dot"></span>REC</span><span id="time" class="val">00:00</span></div>
      <div class="row"><span>Zoom</span><span id="zoom" class="val"></span></div>
      <div class="row"><span>Draw</span><span id="draw" class="val"></span></div>
      <div class="row"><span>Highlight</span><span id="highlight" class="val"></span></div>
      <div class="row"><span>Shots</span><span id="shots" class="val"></span></div>
    </div>
    <div id="keys" class="keys"></div>
  </div>
  <script src="panel.js"></script>
</body>
</html>
